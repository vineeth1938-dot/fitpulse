# Render blueprint for the API. The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: fitpulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY      # the Supabase SECRET key; server only
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS      # your Vercel URL, e.g. https://fitpulse.vercel.app
        sync: false
